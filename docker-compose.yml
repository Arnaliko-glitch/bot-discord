services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discord_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-discord_dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-discord_dashboard}']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    env_file: .env
    environment:
      # Toujours le nom du service Postgres en Docker, indépendamment de la
      # valeur de développement local (localhost) dans le .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-discord_dashboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-discord_dashboard}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/apps/web/public/uploads
    expose:
      - '3000'

  bot:
    build:
      context: .
      target: bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discord_dashboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-discord_dashboard}
    depends_on:
      postgres:
        condition: service_healthy

  # Sauvegarde pg_dump quotidienne à heure fixe (boucle interne, voir
  # scripts/backup-db.sh) — un fichier .sql.gz par jour dans ./backups sur
  # l'hôte, conservés BACKUP_RETENTION_DAYS jours (7 par défaut) puis
  # supprimés automatiquement.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-discord_dashboard}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-discord_dashboard}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-db.sh:/backup-db.sh:ro
    entrypoint: ['/bin/sh', '/backup-db.sh']
    depends_on:
      postgres:
        condition: service_healthy

  # Applique le schéma Prisma à la base — ne démarre jamais avec `docker
  # compose up` (profil dédié), à lancer manuellement : voir README.
  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discord_dashboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-discord_dashboard}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['tools']

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    # Permet à nginx de proxy /downloads et /icons vers l'Apache de l'hôte
    # (port 8081, hors Docker) — voir location blocks dans nginx.conf.template.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - web

  # Renouvelle automatiquement le certificat Let's Encrypt (vérifie deux
  # fois par jour, ne renouvelle réellement que dans les ~30 jours avant
  # expiration) — l'obtention du tout premier certificat se fait à part,
  # une seule fois avant le premier démarrage (voir README).
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint:
      - /bin/sh
      - -c
      - 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  postgres_data:
  uploads_data:
  certbot_www:
  certbot_conf:
