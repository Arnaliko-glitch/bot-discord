# Reverse proxy minimal vers le dashboard (le bot n'a pas de port HTTP à
# exposer, il ne fait que se connecter en sortant vers l'API Discord).
# Adapter server_name à ton domaine, et ajouter un bloc SSL (443) si tu
# passes par certbot/Let's Encrypt.
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
